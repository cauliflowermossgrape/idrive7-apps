name: Experimental apps

on:
  pull_request:
    paths:
      - 'apps/zf8hp/**'
      - 'apps/live_adjustments/**'
      - 'apps/live_data/**'
      - 'kit/runtime/diag.js'
      - 'kit/runtime/readonly-diag.js'
      - 'kit/runtime/sgbd.js'
      - 'kit/runtime/sheet.js'
      - 'kit/tools/sgbd_catalog.py'
      - 'kit/tools/test_live_data.js'
      - 'kit/tools/test_bm3_protocol.js'
      - 'kit/tools/test_zf8hp.js'
      - 'kit/tools/test_live_adjustments.js'
      - 'kit/tools/test_live_adjustments_exhaust.js'
      - 'kit/tools/test_diag_options.js'
      - 'kit/tools/test_diag_replies.js'
      - '.github/workflows/experimental-apps.yml'
  push:
    paths:
      - 'apps/zf8hp/**'
      - 'apps/live_adjustments/**'
      - 'apps/live_data/**'
      - 'kit/runtime/diag.js'
      - 'kit/runtime/readonly-diag.js'
      - 'kit/runtime/sgbd.js'
      - 'kit/runtime/sheet.js'
      - 'kit/tools/sgbd_catalog.py'
      - 'kit/tools/test_live_data.js'
      - 'kit/tools/test_bm3_protocol.js'
      - 'kit/tools/test_zf8hp.js'
      - 'kit/tools/test_live_adjustments.js'
      - 'kit/tools/test_live_adjustments_exhaust.js'
      - 'kit/tools/test_diag_options.js'
      - 'kit/tools/test_diag_replies.js'
      - '.github/workflows/experimental-apps.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kit/tools/test_bm3_protocol.js
      - run: node kit/tools/test_zf8hp.js
      - run: node kit/tools/test_live_adjustments.js
      - run: node kit/tools/test_live_adjustments_exhaust.js
      - run: node kit/tools/test_diag_options.js
      - run: node kit/tools/test_diag_replies.js
      - run: node kit/tools/test_live_data.js
