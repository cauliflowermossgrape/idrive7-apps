name: App tests

# The kit runtime and the apps' synthetic checks (no SDK, renderer or car needed). Live Adjustments and
# ZF 8HP have theirs in experimental-apps.yml; the renderer's are in renderd.yml.
on:
  pull_request:
    paths:
      - 'apps/**'                 # test_zh.py checks every app.json and the text in every app
      - 'kit/runtime/**'
      - 'kit/tools/test_*'
      - 'kit/tools/redline_*.js' # the tests' shared harness and sample turns
      - 'kit/tools/fixtures/**'   # recorded car data the tests replay (redline-nav-carplay-*.txt)
      - 'kit/localization/**'
      - 'kit/tools/build.py'
      - 'kit/tools/pack_data.py'
      - 'kit/tools/localize.py'
      - 'kit/tools/import_diagnostic_ru.py'
      - 'kit/tools/build_diagnostic_ru.py'
      - 'kit/tools/build_diagnostic_zh.py'
      - 'kit/tools/bake_cjk.py'
      - 'kit/tools/locale-revisions.json'
      - '.github/workflows/app-tests.yml'
  push:
    paths:
      - 'apps/**'                 # test_zh.py checks every app.json and the text in every app
      - 'kit/runtime/**'
      - 'kit/tools/test_*'
      - 'kit/tools/redline_*.js' # the tests' shared harness and sample turns
      - 'kit/tools/fixtures/**'   # recorded car data the tests replay (redline-nav-carplay-*.txt)
      - 'kit/localization/**'
      - 'kit/tools/build.py'
      - 'kit/tools/pack_data.py'
      - 'kit/tools/localize.py'
      - 'kit/tools/import_diagnostic_ru.py'
      - 'kit/tools/build_diagnostic_ru.py'
      - 'kit/tools/build_diagnostic_zh.py'
      - 'kit/tools/bake_cjk.py'
      - 'kit/tools/locale-revisions.json'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node kit/tools/test_runtime.js
      - run: node kit/tools/test_dids.js
      - run: node kit/tools/test_engine.js
      - run: node kit/tools/test_edrive.js
      - run: node kit/tools/test_widget_fixes.js
      - run: node kit/tools/test_warmup.js
      - run: node kit/tools/test_draggy.js
      - run: node kit/tools/test_brake_test.js
      - run: node kit/tools/test_gforce.js
      - run: node kit/tools/test_service.js
      - run: node kit/tools/test_service_engine.js
      - run: node kit/tools/test_car_vitals.js
      - run: node kit/tools/test_redline_hud.js
      - run: node kit/tools/test_hud_claim.js
      - run: node kit/tools/test_redline_running.js
      - run: node kit/tools/test_redline_navlog.js
      - run: node kit/tools/test_redline_nav.js
      - run: node kit/tools/test_redline_hud_nav.js
      - run: node kit/tools/test_redline_features.js
      - run: node kit/tools/test_redline_fuel.js
      - run: node kit/tools/test_redline_powerbar.js
      - run: node kit/tools/test_redline_powerlog.js
      - run: node kit/tools/test_redline_meter_draw.js
      - run: node kit/tools/test_redline_meter_m.js
      - run: node kit/tools/test_redline_hud_cache.js
      - run: node kit/tools/test_ambient_config.js
      - run: node kit/tools/test_ambient_rgb.js
      - run: node kit/tools/test_xdrive_live.js
      - run: node kit/tools/test_zh.js
      # The run above loads the English catalog, so it skips the glyph check: test_zh.js has to run on zh-CN stages for
      # that (--preview-only needs no SDK). dtc_scanner has its own run because it ships diagnostic-zh-CN.json as its atlas.
      - run: python3 kit/tools/build.py --language zh-CN --preview-only service
      - run: python3 kit/tools/build.py --language zh-CN --preview-only dtc_scanner
      - run: node kit/tools/test_zh.js dist/service/source/javascript/kit
      - run: node kit/tools/test_zh.js dist/dtc_scanner/source/javascript/kit
      # test_zh.js only covers the UI catalog: the fault texts in diagnostic_i18n.pack are checked here.
      - run: node kit/tools/test_diagnostic_zh.js dist/dtc_scanner/source/javascript
      - run: cd kit/tools && python3 test_zh.py
      - run: python3 kit/tools/test_import_diagnostic_ru.py

  # The head unit runs Node 8.16.2, so code that only works on newer Node passes the job above and fails in the car
  # (#114's mkdirSync recursive). Runtime tests are added here as each one runs on 8.16.2 (#115).
  node8-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '8.16.2'
      - run: node --version
      - run: node kit/tools/test_redline_hud.js
      - run: node kit/tools/test_hud_claim.js
      - run: node kit/tools/test_redline_running.js
      - run: node kit/tools/test_redline_navlog.js
      - run: node kit/tools/test_redline_nav.js
      - run: node kit/tools/test_redline_hud_nav.js
      - run: node kit/tools/test_redline_features.js
      - run: node kit/tools/test_ambient_rgb.js
      - run: node kit/tools/test_redline_fuel.js
      - run: node kit/tools/test_redline_powerbar.js
      - run: node kit/tools/test_redline_powerlog.js
      - run: node kit/tools/test_redline_meter_draw.js
      - run: node kit/tools/test_redline_meter_m.js
      - run: node kit/tools/test_redline_hud_cache.js
