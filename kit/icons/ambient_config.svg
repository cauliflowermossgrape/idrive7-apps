<!-- accent: #8a5cff -->
<defs>
  <linearGradient id="a-rim" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset="0.25" stop-color="#b9c1ca"/><stop offset="0.55" stop-color="#58616b"/>
    <stop offset="0.8" stop-color="#2a2f35"/><stop offset="1" stop-color="#9aa4ae"/></linearGradient>
  <linearGradient id="a-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d2e"/><stop offset="0.6" stop-color="#0a0b14"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="a-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22a6ff"/><stop offset="0.5" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff2d6f"/></linearGradient>
  <radialGradient id="a-wash" cx="0.5" cy="0.3" r="0.7"><stop offset="0" stop-color="#8a5cff" stop-opacity="0.35"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="a-pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff2d6f" stop-opacity="0.75"/><stop offset="1" stop-color="#ff2d6f" stop-opacity="0"/></radialGradient>
  <radialGradient id="a-pool2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22a6ff" stop-opacity="0.75"/><stop offset="1" stop-color="#22a6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="a-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <filter id="a-glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
