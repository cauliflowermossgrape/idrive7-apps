<!-- accent: #2fd27a -->
<defs>
  <linearGradient id="b-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="0.35" stop-color="#b9c1c9"/><stop offset="0.7" stop-color="#5d666f"/><stop offset="1" stop-color="#2b3036"/></linearGradient>
  <linearGradient id="b-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4048"/><stop offset="0.18" stop-color="#1d2126"/><stop offset="0.75" stop-color="#0d0f12"/><stop offset="1" stop-color="#22262c"/></linearGradient>
  <linearGradient id="b-post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a939c"/><stop offset="0.45" stop-color="#f2f4f6"/><stop offset="1" stop-color="#6b737b"/></linearGradient>
  <linearGradient id="b-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a8a"/><stop offset="0.45" stop-color="#e4202a"/><stop offset="1" stop-color="#8c0b12"/></linearGradient>
  <linearGradient id="b-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ffd8"/><stop offset="0.3" stop-color="#46e891"/><stop offset="1" stop-color="#0a7a3c"/></linearGradient>
  <filter id="b-glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- terminals: minus left, plus right (red cap) -->
<rect x="31" y="24" width="18" height="16" rx="3" fill="url(#b-post)"/>
<rect x="91" y="24" width="18" height="16" rx="3" fill="url(#b-post)"/>
<rect x="89" y="21" width="22" height="9" rx="4" fill="url(#b-red)"/>
